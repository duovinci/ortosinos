<title>Ortosinos - Painel de Atendimento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #14201c;
    --ink-soft: #4a5852;
    --ink-faint: #8a968f;
    --paper: #f6f4ee;
    --card: #ffffff;
    --line: #e3e0d6;
    --line-soft: #eeece4;
    --pine: #1f5d4c;
    --pine-deep: #16473a;
    --clay: #c2703d;
    --sky: #2f6f8f;
    --gold: #b8912f;
    --rose: #a84a5b;
    --shadow: 0 1px 2px rgba(20,32,28,.04), 0 4px 16px rgba(20,32,28,.05);
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100%; }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8d5c9; border-radius: 8px; border: 3px solid var(--paper); }

  /* LOGIN */
  .login-wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 40px 34px; box-shadow: var(--shadow); }
  .login-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--pine); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin-bottom: 22px; }
  .login-card h1 { font-size: 25px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.02em; }
  .login-card p.sub { color: var(--ink-faint); font-size: 14px; margin: 0 0 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fcfbf8; transition: border-color .15s, box-shadow .15s; }
  .field input:focus { outline: none; border-color: var(--pine); box-shadow: 0 0 0 3px rgba(31,93,76,.1); background: #fff; }
  .btn-primary { width: 100%; background: var(--pine); color: #fff; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14.5px; transition: background .15s; }
  .btn-primary:hover { background: var(--pine-deep); }
  .login-err { color: var(--rose); font-size: 13px; margin: 0 0 16px; padding: 9px 12px; background: rgba(168,74,91,.08); border-radius: 8px; }

  /* SHELL */
  .shell { display: flex; height: 100%; }
  .side { width: 232px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 14px; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 20px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 3px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; line-height: 1.1; }
  .brand-name small { display: block; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 11px; color: var(--ink-faint); letter-spacing: .02em; }
  .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border-radius: 10px; color: var(--ink-soft); font-size: 14px; font-weight: 500; text-align: left; transition: background .13s, color .13s; }
  .nav-item:hover { background: var(--line-soft); color: var(--ink); }
  .nav-item.active { background: var(--pine); color: #fff; }
  .nav-item .ic { width: 18px; height: 18px; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13px; color: var(--ink-soft); }
  .user-av { width: 30px; height: 30px; border-radius: 50%; background: var(--clay); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .logout-btn { font-size: 12.5px; color: var(--ink-faint); padding: 6px 10px; }
  .logout-btn:hover { color: var(--rose); }

  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .topbar { padding: 26px 34px 20px; }
  .topbar h2 { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  .topbar .crumb { font-size: 13.5px; color: var(--ink-faint); margin: 2px 0 0; }
  .content { padding: 0 34px 40px; }

  /* PIPELINE */
  .pipe-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .selectbox { position: relative; }
  .selectbox select { appearance: none; padding: 9px 32px 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font-size: 13.5px; font-weight: 500; color: var(--ink); cursor: pointer; }
  .selectbox::after { content: ''; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-faint); border-bottom: 1.5px solid var(--ink-faint); transform: translateY(-65%) rotate(45deg); pointer-events: none; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; }
  .col { background: transparent; }
  .col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 12px; }
  .col-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; }
  .col-count { font-size: 12px; color: var(--ink-faint); background: var(--line-soft); padding: 1px 8px; border-radius: 20px; }
  .col-body { display: flex; flex-direction: column; gap: 10px; min-height: 60px; padding: 4px; border-radius: 12px; transition: background .15s; }
  .col-body.drag-over { background: rgba(31,93,76,.06); outline: 1.5px dashed rgba(31,93,76,.3); }
  .lead { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; box-shadow: var(--shadow); cursor: grab; transition: box-shadow .15s, transform .1s, border-color .15s; }
  .lead:hover { border-color: #d4d0c4; box-shadow: 0 2px 4px rgba(20,32,28,.05), 0 8px 22px rgba(20,32,28,.07); }
  .lead:active { cursor: grabbing; }
  .lead.dragging { opacity: .4; }
  .lead-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .lead-name { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
  .lead-sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 1px; }
  .assunto-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 7px; white-space: nowrap; flex-shrink: 0; }
  .lead-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--line-soft); color: var(--ink-soft); font-weight: 500; }
  .chip.ret { background: rgba(31,93,76,.1); color: var(--pine); }
  .lead-time { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }
  .lead-actions { display: flex; gap: 6px; margin-top: 11px; }
  .mini-btn { flex: 1; font-size: 12px; font-weight: 500; padding: 7px; border-radius: 8px; background: var(--line-soft); color: var(--ink-soft); transition: background .13s, color .13s; }
  .mini-btn:hover { background: var(--pine); color: #fff; }

  /* PACIENTES */
  .search { flex: 1; min-width: 200px; max-width: 340px; position: relative; }
  .search input { width: 100%; padding: 9px 13px 9px 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
  .search input:focus { outline: none; border-color: var(--pine); box-shadow: 0 0 0 3px rgba(31,93,76,.1); }
  .search .si { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-faint); padding: 13px 16px; border-bottom: 1px solid var(--line); background: #fbfaf6; }
  tbody td { padding: 13px 16px; font-size: 13.5px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #fbfaf6; }
  .pac-name { font-weight: 600; }

  .field select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fcfbf8; appearance: none; cursor: pointer; }

  .spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--pine); border-radius: 50%; animation: sp 0.7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 100; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

  .lead-move { display: none; }

    tbody td { border: none; padding: 4px 0; font-size: 14px; }

    .day-cell { min-height: 62px; padding: 4px; }

    .cal-tools .selectbox { margin-left: 0 !important; flex: 1; }
    .cal-tools .selectbox select { width: 100%; }
    .wk-head.week > div { padding: 8px 2px; font-size: 10px; }

    .pipe-tools .selectbox { flex: 1; }

function iniciais(nome){ return (nome||'?').split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join(''); }
function primeiroUltimo(nome){ const p=(nome||'').split(' ').filter(Boolean); return p.length>1?p[0]+' '+p[p.length-1]:nome; }
function tempoRel(iso){ const d=(Date.now()-new Date(iso))/60000; if(d<1)return'agora'; if(d<60)return Math.floor(d)+'min'; if(d<1440)return Math.floor(d/60)+'h'; return Math.floor(d/1440)+'d'; }
function fmtHora(iso){ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

// ---------- LOGIN ----------
function Login({ onLogin }) {

  return (

          <label>Senha</label>
          <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==='Enter'&&entrar()} placeholder="••••••••" />
        </div>
        <button className="btn-primary" onClick={entrar}>Entrar</button>
      </div>
    </div>
  );
}

// ---------- ICONES ----------
const Ic = {
  pipe: <svg className="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>,
  cal: <svg className="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>,
  users: <svg className="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 14c2.5 0 5 2 5 6"/><circle cx="17" cy="8" r="2.5"/></svg>,
  search: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>,
  chevL: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>,
  chevR: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>,
  plus: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 5v14M5 12h14"/></svg>,
};

// ---------- APP ----------
function App() {
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('orto_user')); } catch { return null; } });
  const [view, setViewRaw] = useState(() => localStorage.getItem('orto_view') || 'pipeline');
  const setView = useCallback((v) => { localStorage.setItem('orto_view', v); setViewRaw(v); }, []);
  const [medicos, setMedicos] = useState([]);
  const [atend, setAtend] = useState([]);
  const [agend, setAgend] = useState([]);
  const [pacientes, setPacientes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState('');
  const [modal, setModal] = useState(null);

  const showToast = useCallback((m) => { setToast(m); setTimeout(()=>setToast(''), 2200); }, []);

  const carregar = useCallback(async () => {
    setLoading(true);
    const [m, a, g, p] = await Promise.all([
      sb.from('medicos').select('*').eq('ativo', true).order('id'),
      sb.from('atendimentos').select('*').order('criado_em', { ascending: true }),
      sb.from('agendamentos').select('*').order('inicio'),
      sb.from('pacientes').select('*').order('nome'),
    ]);
    if (m.data) setMedicos(m.data);
    if (a.data) setAtend(a.data);
    if (g.data) setAgend(g.data);
    if (p.data) setPacientes(p.data);
    setLoading(false);
  }, []);

  useEffect(() => { if (user) carregar(); }, [user, carregar]);

  const medById = useMemo(() => Object.fromEntries(medicos.map(m => [m.id, m])), [medicos]);
  const medColor = useCallback((id) => MED_CORES[(medicos.findIndex(m=>m.id===id)) % MED_CORES.length] || '#1f5d4c', [medicos]);

  if (!user) return <Login onLogin={setUser} />;

  function sair(){ localStorage.removeItem('orto_user'); setUser(null); }

  async function moverPipeline(id, novoStatus){
    setAtend(prev => prev.map(a => a.id===id ? {...a, status_pipeline: novoStatus} : a));
    await sb.from('atendimentos').update({ status_pipeline: novoStatus }).eq('id', id);
  }

  async function upsertPaciente({ nome, numero_whatsapp, convenio, tipo_paciente }){
    if (!nome) return;
    // Se ja existe paciente com esse telefone, nao duplica
    if (numero_whatsapp) {
      const existe = pacientes.find(p => p.numero_whatsapp === numero_whatsapp);
      if (existe) return;
    }
    const novo = { nome, numero_whatsapp: numero_whatsapp || null, convenio: convenio || null, tipo_paciente: tipo_paciente || null };
    const { data } = await sb.from('pacientes').insert(novo).select();
    if (data && data[0]) setPacientes(prev => [...prev, data[0]].sort((a,b)=>a.nome.localeCompare(b.nome)));
  }

  async function salvarAgendamento(dados, editId){
    if (editId) {
      const { data, error } = await sb.from('agendamentos').update(dados).eq('id', editId).select();
      if (error) { showToast('Erro ao salvar'); return; }
      if (data) setAgend(prev => prev.map(a => a.id===editId ? data[0] : a));
      setModal(null);
      showToast('Consulta atualizada');
      return;
    }
    // Novo agendamento
    let atendimentoId = dados.atendimento_id;
    // Avulso (sem lead da triagem): cria atendimento em Agendado pra aparecer no pipeline
    if (!atendimentoId) {
      const novoAtend = {
        numero_whatsapp: dados.numero_whatsapp || null,
        nome_paciente: dados.nome_paciente,
        convenio: dados.convenio || null,
        medico_id: dados.medico_id,
        assunto: dados.assunto || 'agendamento',
        status_pipeline: 'agendado',
      };
      const r = await sb.from('atendimentos').insert(novoAtend).select();
      if (r.error) { showToast('Erro ao criar atendimento: '+r.error.message); return; }
      if (r.data && r.data[0]) { atendimentoId = r.data[0].id; setAtend(prev => [...prev, r.data[0]]); }
    }
    const { error, data } = await sb.from('agendamentos').insert({ ...dados, atendimento_id: atendimentoId }).select();
    if (error) { showToast('Erro ao agendar'); return; }
    if (data) setAgend(prev => [...prev, ...data]);
    if (dados.atendimento_id) await moverPipeline(dados.atendimento_id, 'agendado');
    // Cadastra o paciente automaticamente
    await upsertPaciente({ nome: dados.nome_paciente, numero_whatsapp: dados.numero_whatsapp, convenio: dados.convenio });
    setModal(null);
    showToast('Consulta agendada');
  }

  async function cancelarAgendamento(id){
    const { error } = await sb.from('agendamentos').delete().eq('id', id);
    if (error) { showToast('Erro ao cancelar'); return; }
    setAgend(prev => prev.filter(a => a.id !== id));
    setModal(null);
    showToast('Consulta cancelada');
  }

  async function salvarPaciente(dados, id){
    if (id) {
      const { data, error } = await sb.from('pacientes').update(dados).eq('id', id).select();
      if (error) { showToast('Erro ao salvar'); return; }
      if (data) setPacientes(prev => prev.map(p => p.id===id ? data[0] : p).sort((a,b)=>a.nome.localeCompare(b.nome)));
      showToast('Paciente atualizado');
    } else {
      const { data, error } = await sb.from('pacientes').insert(dados).select();
      if (error) { showToast('Erro ao cadastrar'); return; }
      if (data) setPacientes(prev => [...prev, ...data].sort((a,b)=>a.nome.localeCompare(b.nome)));
      showToast('Paciente cadastrado');
    }
    setModal(null);
  }

  return (
    <div className="shell">

// ---------- PIPELINE ----------
function Pipeline({ atend, medById, medicos, medColor, onMove, onAgendar }) {
  const [fMed, setFMed] = useState('');
  const [fAss, setFAss] = useState('');
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);

  const filtrado = useMemo(() => atend.filter(a =>
    (!fMed || a.medico_id === +fMed) && (!fAss || a.assunto === fAss)
  ), [atend, fMed, fAss]);

  function drop(col){ if(dragId){ onMove(dragId, col); setDragId(null); setOverCol(null); } }

  return (
    <>
      <div className="topbar">
        <h2 className="serif">Atendimentos</h2>
        <p className="crumb">Leads da triagem, em ordem de chegada</p>
      </div>
      <div className="content">
        <div className="pipe-tools">
          <div className="selectbox">
            <select value={fMed} onChange={e=>setFMed(e.target.value)}>
              <option value="">Todos os médicos</option>
              {medicos.map(m => <option key={m.id} value={m.id}>{primeiroUltimo(m.nome)}</option>)}
            </select>
          </div>
          <div className="selectbox">
            <select value={fAss} onChange={e=>setFAss(e.target.value)}>
              <option value="">Todos os assuntos</option>
              {Object.entries(ASSUNTOS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          {(fMed||fAss) && <button className="mini-btn" style={{flex:'none',padding:'8px 14px'}} onClick={()=>{setFMed('');setFAss('');}}>Limpar filtros</button>}
        </div>
        <div className="board">
          {COLS.map(col => {
            const items = filtrado.filter(a => a.status_pipeline === col.key);
            return (
              <div className="col" key={col.key}>
                <div className="col-head">
                  <div className="col-title"><span className="col-dot" style={{background:col.color}}></span>{col.label}</div>
                  <span className="col-count">{items.length}</span>
                </div>
                <div className={'col-body'+(overCol===col.key?' drag-over':'')}
                  onDragOver={e=>{e.preventDefault();setOverCol(col.key);}}
                  onDragLeave={()=>setOverCol(null)}
                  onDrop={()=>drop(col.key)}>
                  {items.map(a => (
                    <LeadCard key={a.id} a={a} med={medById[a.medico_id]} medColor={medColor} onAgendar={onAgendar} onMove={onMove}
                      onDragStart={()=>setDragId(a.id)} onDragEnd={()=>setDragId(null)} dragging={dragId===a.id} />
                  ))}
                  {items.length===0 && <div style={{fontSize:12,color:'var(--ink-faint)',textAlign:'center',padding:'14px 0'}}>Vazio</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

function LeadCard({ a, med, medColor, onAgendar, onDragStart, onDragEnd, dragging, onMove }) {
  const ass = ASSUNTOS[a.assunto] || ASSUNTOS.outro;
  const idx = COLS.findIndex(c => c.key === a.status_pipeline);
  return (
    <div className={'lead'+(dragging?' dragging':'')} draggable onDragStart={onDragStart} onDragEnd={onDragEnd}>
      <div className="lead-top">
        <div>
          <div className="lead-name">{a.nome_paciente || 'Sem nome'}</div>
          <div className="lead-sub">{med ? primeiroUltimo(med.nome) : 'Sem médico'}</div>
        </div>
        <span className="assunto-tag" style={{background:ass.bg,color:ass.fg}}>{ass.label}</span>
      </div>
      <div className="lead-meta">
        <span className={'chip'+(a.tipo_paciente==='retorno'?' ret':'')}>{a.tipo_paciente==='retorno'?'Retorno':'1ª vez'}</span>
        <span className="chip">{a.convenio==='particular'?'Particular':'Convênio'}</span>
        <span className="lead-time">{tempoRel(a.criado_em)}</span>
      </div>
      <div className="lead-move">
        <button disabled={idx<=0} onClick={()=>onMove(a.id, COLS[idx-1].key)} title="Voltar fase">←</button>
        <button disabled={idx>=COLS.length-1} onClick={()=>onMove(a.id, COLS[idx+1].key)} title="Avançar fase">→</button>
      </div>
      {a.status_pipeline==='aguardando' && (
        <div className="lead-actions">
          <button className="mini-btn" onClick={()=>onAgendar(a)}>Agendar consulta</button>
        </div>
      )}
    </div>
  );
}

// ---------- PACIENTES ----------
function Pacientes({ pacientes, atend, onNovo, onEdit }) {
  const [q, setQ] = useState('');
  const visitasPorTel = useMemo(() => {
    const m = {}; atend.forEach(a => { if(a.numero_whatsapp) m[a.numero_whatsapp]=(m[a.numero_whatsapp]||0)+1; }); return m;
  }, [atend]);
  const lista = useMemo(() => {
    let arr = pacientes;
    if (q) arr = arr.filter(p => (p.nome||'').toLowerCase().includes(q.toLowerCase()) || (p.numero_whatsapp||'').includes(q));
    return arr;
  }, [pacientes, q]);

  return (
    <>
      <div className="topbar"><h2 className="serif">Pacientes</h2><p className="crumb">{pacientes.length} pacientes cadastrados</p></div>
      <div className="content">
        <div className="pipe-tools">
          <div className="search"><span className="si">{Ic.search}</span><input placeholder="Buscar por nome ou telefone" value={q} onChange={e=>setQ(e.target.value)} /></div>
          <button className="btn-primary" style={{width:'auto',padding:'9px 16px',display:'flex',alignItems:'center',gap:7,marginLeft:'auto'}} onClick={onNovo}>{Ic.plus}Novo paciente</button>
        </div>
        {lista.length===0 ? <div className="empty"><span className="serif">Nenhum paciente encontrado</span>{q?'Tente outra busca.':'Cadastre o primeiro paciente ou aguarde a triagem no WhatsApp.'}</div> : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Paciente</th><th>Telefone</th><th>Tipo</th><th>Convênio</th><th>Contatos</th><th></th></tr></thead>
              <tbody>
                {lista.map(p => (
                  <tr key={p.id} onClick={()=>onEdit(p)} style={{cursor:'pointer'}}>
                    <td><span className="pac-av">{iniciais(p.nome)}</span><span className="pac-name">{p.nome}</span></td>
                    <td data-lbl="Telefone">{p.numero_whatsapp||'—'}</td>
                    <td data-lbl="Tipo">{p.tipo_paciente==='retorno'?'Retorno':p.tipo_paciente==='novo'?'1ª vez':'—'}</td>
                    <td data-lbl="Convênio">{p.convenio==='particular'?'Particular':p.convenio?'Convênio':'—'}</td>
                    <td data-lbl="Contatos">{visitasPorTel[p.numero_whatsapp]||0}</td>
                    <td style={{color:'var(--ink-faint)',fontSize:12}}>Editar</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </>
  );
}

function ModalPaciente({ base, onClose, onSave }) {
  const ed = base.paciente;
  const [nome, setNome] = useState(ed?.nome || '');
  const [tel, setTel] = useState(ed?.numero_whatsapp || '');
  const [conv, setConv] = useState(ed?.convenio || 'convenio');
  const [tipo, setTipo] = useState(ed?.tipo_paciente || 'novo');
  const [nasc, setNasc] = useState(ed?.data_nascimento || '');
  const [obs, setObs] = useState(ed?.observacao || '');
  function salvar(){
    if (!nome.trim()) return;
    onSave({ nome: nome.trim(), numero_whatsapp: tel||null, convenio: conv, tipo_paciente: tipo, data_nascimento: nasc||null, observacao: obs||null }, ed?.id);
  }
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3 className="serif">{ed?'Editar paciente':'Novo paciente'}</h3><p>{ed?'Atualize os dados do cadastro':'Cadastre um paciente manualmente'}</p></div>
        <div className="modal-body">
          <div className="field"><label>Nome completo</label><input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Nome do paciente" /></div>
          <div className="field"><label>Telefone</label><input value={tel} onChange={e=>setTel(e.target.value)} placeholder="Opcional" /></div>
          <div className="row2">
            <div className="field"><label>Tipo</label><select value={tipo} onChange={e=>setTipo(e.target.value)}><option value="novo">1ª vez</option><option value="retorno">Retorno</option></select></div>
            <div className="field"><label>Convênio</label><select value={conv} onChange={e=>setConv(e.target.value)}><option value="convenio">Convênio</option><option value="particular">Particular</option></select></div>
          </div>
          <div className="field"><label>Data de nascimento</label><input type="date" value={nasc} onChange={e=>setNasc(e.target.value)} /></div>
          <div className="field"><label>Observação</label><textarea value={obs} onChange={e=>setObs(e.target.value)} placeholder="Opcional" /></div>
        </div>
        <div className="modal-foot"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn-primary" onClick={salvar}>{ed?'Salvar alterações':'Cadastrar'}</button></div>
      </div>
    </div>
  );
}

// ---------- CALENDARIO ----------
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const HORAS = Array.from({length:12},(_,i)=>i+7); // 7h as 18h

function Calendario({ agend, medicos, medById, medColor, onNovo, onEditar }) {
  const [modo, setModo] = useState('mes');
  const [refDate, setRefDate] = useState(new Date());
  const [fMed, setFMed] = useState('');

  const evs = useMemo(() => agend.filter(a => !fMed || a.medico_id === +fMed), [agend, fMed]);
  const hoje = new Date(); const ehHoje = (d)=> d.toDateString()===hoje.toDateString();

  function nav(dir){
    const d = new Date(refDate);
    if (modo==='mes') d.setMonth(d.getMonth()+dir);
    else if (modo==='semana') d.setDate(d.getDate()+dir*7);
    else d.setDate(d.getDate()+dir);
    setRefDate(d);
  }
  function label(){
    if (modo==='mes') return MESES[refDate.getMonth()]+' '+refDate.getFullYear();
    if (modo==='dia') return refDate.getDate()+' de '+MESES[refDate.getMonth()];
    const ini = inicioSemana(refDate); const fim = new Date(ini); fim.setDate(fim.getDate()+6);
    return ini.getDate()+' – '+fim.getDate()+' '+MESES[fim.getMonth()];
  }

  return (
    <>
      <div className="topbar"><h2 className="serif">Calendário</h2><p className="crumb">Agenda de consultas por médico</p></div>
      <div className="content">
        <div className="cal-tools">
          <div className="seg">
            <button className={modo==='mes'?'on':''} onClick={()=>setModo('mes')}>Mês</button>
            <button className={modo==='semana'?'on':''} onClick={()=>setModo('semana')}>Semana</button>
            <button className={modo==='dia'?'on':''} onClick={()=>setModo('dia')}>Dia</button>
          </div>
          <div className="cal-nav">
            <button onClick={()=>nav(-1)}>{Ic.chevL}</button>
            <div className="cal-label serif">{label()}</div>
            <button onClick={()=>nav(1)}>{Ic.chevR}</button>
          </div>
          <div className="selectbox" style={{marginLeft:'auto'}}>
            <select value={fMed} onChange={e=>setFMed(e.target.value)}>
              <option value="">Todos os médicos</option>
              {medicos.map(m => <option key={m.id} value={m.id}>{primeiroUltimo(m.nome)}</option>)}
            </select>
          </div>
          <button className="btn-primary" style={{width:'auto',padding:'9px 16px',display:'flex',alignItems:'center',gap:7}} onClick={()=>onNovo(new Date(refDate.getFullYear(),refDate.getMonth(),refDate.getDate(),9,0))}>{Ic.plus}Nova consulta</button>
        </div>
        {modo==='mes' && <MesView refDate={refDate} evs={evs} medColor={medColor} ehHoje={ehHoje} onNovo={onNovo} onEditar={onEditar} />}
        {modo==='semana' && <SemanaView refDate={refDate} evs={evs} medColor={medColor} ehHoje={ehHoje} onNovo={onNovo} onEditar={onEditar} />}
        {modo==='dia' && <DiaView refDate={refDate} evs={evs} medColor={medColor} onNovo={onNovo} onEditar={onEditar} />}
      </div>
    </>
  );
}

function inicioSemana(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }

function MesView({ refDate, evs, medColor, ehHoje, onNovo, onEditar }) {
  const ano=refDate.getFullYear(), mes=refDate.getMonth();
  const prim=new Date(ano,mes,1), ini=new Date(prim); ini.setDate(ini.getDate()-prim.getDay());
  const dias=[]; for(let i=0;i<42;i++){ const d=new Date(ini); d.setDate(d.getDate()+i); dias.push(d); }
  const evsDia=(d)=>evs.filter(e=>new Date(e.inicio).toDateString()===d.toDateString());
  return (
    <div className="grid-month">
      {DIAS.map(d=><div className="dow" key={d}>{d.toUpperCase()}</div>)}
      {dias.map((d,i)=>{
        const evd=evsDia(d); const outro=d.getMonth()!==mes;
        return (
          <div className={'day-cell'+(outro?' other':'')+(ehHoje(d)?' today':'')} key={i} onClick={()=>onNovo(new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0))}>
            <div className="day-num">{d.getDate()}</div>
            {evd.slice(0,3).map(e=><div className="ev" key={e.id} style={{background:medColor(e.medico_id)}} title={e.nome_paciente} onClick={(ev)=>{ev.stopPropagation();onEditar(e);}}>{fmtHora(e.inicio)} {primeiroUltimo(e.nome_paciente)}</div>)}
            {evd.length>3 && <div style={{fontSize:10,color:'var(--ink-faint)',paddingLeft:2}}>+{evd.length-3} mais</div>}
          </div>
        );
      })}
    </div>
  );
}

function SemanaView({ refDate, evs, medColor, ehHoje, onNovo, onEditar }) {
  const ini=inicioSemana(refDate); const dias=Array.from({length:7},(_,i)=>{const d=new Date(ini);d.setDate(d.getDate()+i);return d;});
  return (
    <div className="cal-week">
      <div className="wk-head week">
        <div></div>
        {dias.map((d,i)=><div key={i}>{DIAS[i]}<span className={'wd-num'+(ehHoje(d)?' today':'')}>{d.getDate()}</span></div>)}
      </div>
      <div className="wk-body">
        {HORAS.map(h=>(
          <div className="hour-row week" key={h}>
            <div className="hour-label">{h}:00</div>
            {dias.map((d,i)=>{
              const cel=new Date(d); cel.setHours(h,0,0,0);
              const evh=evs.filter(e=>{const ed=new Date(e.inicio); return ed.toDateString()===d.toDateString() && ed.getHours()===h;});
              return <div className="hour-slot" key={i} onClick={()=>onNovo(cel)}>{evh.map(e=><div className="slot-ev" key={e.id} style={{background:medColor(e.medico_id)}} onClick={(ev)=>{ev.stopPropagation();onEditar(e);}}>{primeiroUltimo(e.nome_paciente)}</div>)}</div>;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function DiaView({ refDate, evs, medColor, onNovo }) {
  const evsDia=evs.filter(e=>new Date(e.inicio).toDateString()===refDate.toDateString());
  return (
    <div className="cal-day">
      <div className="wk-head day"><div></div><div>{DIAS[refDate.getDay()]}, {refDate.getDate()} de {MESES[refDate.getMonth()]}</div></div>
      <div className="wk-body">
        {HORAS.map(h=>{
          const cel=new Date(refDate); cel.setHours(h,0,0,0);
          const evh=evsDia.filter(e=>new Date(e.inicio).getHours()===h);
          return (
            <div className="hour-row day" key={h}>
              <div className="hour-label">{h}:00</div>
              <div className="hour-slot" onClick={()=>onNovo(cel)}>{evh.map(e=><div className="slot-ev" key={e.id} style={{background:medColor(e.medico_id)}} onClick={(ev)=>{ev.stopPropagation();onEditar(e);}}>{fmtHora(e.inicio)} · {e.nome_paciente} {e.origem==='ligacao'?'(ligação)':''}</div>)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- MODAL AGENDAR ----------
function ModalAgendar({ medicos, agend, user, base, onClose, onSave, onCancelar }) {
  const pre = base.atend;        // lead da triagem
  const ev = base.evento;        // agendamento existente (edicao)
  const editando = !!ev;
  const dataBase = ev ? new Date(ev.inicio) : (base.data || new Date(new Date().setHours(9,0,0,0)));
  const [nome, setNome] = useState(ev?.nome_paciente || pre?.nome_paciente || '');
  const [medId, setMedId] = useState(ev?.medico_id || pre?.medico_id || (medicos[0]?.id || ''));
  const [tel, setTel] = useState(ev?.numero_whatsapp || pre?.numero_whatsapp || '');
  const [dia, setDia] = useState(toDateInput(dataBase));
  const [hora, setHora] = useState(toTimeInput(dataBase));
  const [dur, setDur] = useState(ev && ev.fim ? String(Math.round((new Date(ev.fim)-new Date(ev.inicio))/60000)) : '30');
  const [obs, setObs] = useState(ev?.observacao || '');
  const [secretaria, setSecretaria] = useState(ev?.secretaria || user?.nome || '');
  const [aviso, setAviso] = useState('');
  const origem = ev ? ev.origem : (pre ? 'triagem' : 'ligacao');

  // Detecta sobreposicao de horario no mesmo medico
  function achaConflito(inicio, fim){
    return agend.find(a => {
      if (editando && a.id === ev.id) return false;   // ignora ele mesmo
      if (a.medico_id !== +medId) return false;
      if (a.status === 'cancelado') return false;
      const ai = new Date(a.inicio); const af = a.fim ? new Date(a.fim) : new Date(ai.getTime()+30*60000);
      return inicio < af && fim > ai;   // sobreposicao
    });
  }

  function montaDados(){
    const inicio = new Date(dia+'T'+hora);
    const fim = new Date(inicio.getTime() + (+dur)*60000);
    return { inicio, fim };
  }

  function tentarSalvar(){
    if (!nome.trim() || !medId || !dia || !hora) return;
    const { inicio, fim } = montaDados();
    const conf = achaConflito(inicio, fim);
    if (conf && !aviso) {
      const med = medicos.find(m=>m.id===+medId);
      setAviso(`${med?primeiroUltimo(med.nome):'Este médico'} já tem ${conf.nome_paciente} às ${fmtHora(conf.inicio)}. Deseja agendar mesmo assim?`);
      return;
    }
    confirmarSalvar(inicio, fim);
  }

  function confirmarSalvar(inicio, fim){
    const dados = {
      atendimento_id: ev?.atendimento_id ?? pre?.id ?? null,
      medico_id: +medId,
      nome_paciente: nome.trim(),
      numero_whatsapp: tel || null,
      convenio: ev?.convenio ?? pre?.convenio ?? null,
      assunto: ev?.assunto ?? pre?.assunto ?? 'agendamento',
      origem,
      inicio: inicio.toISOString(),
      fim: fim.toISOString(),
      observacao: obs || null,
      secretaria: secretaria || null,
    };
    onSave(dados, ev?.id);
  }

  const badgeCor = origem==='triagem'?{bg:'rgba(31,93,76,.12)',fg:'#1f5d4c',txt:'Triagem'}:{bg:'rgba(47,111,143,.12)',fg:'#2f6f8f',txt:'Ligação'};

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3 className="serif">{editando?'Editar consulta':'Agendar consulta'}</h3>
          <p>{editando?'Altere os dados ou cancele':pre?'A partir de um lead da triagem':'Encaixe manual ou por ligação'}
            {' '}<span className="origin-badge" style={{background:badgeCor.bg,color:badgeCor.fg}}>{badgeCor.txt}</span>
          </p>
        </div>
        <div className="modal-body">
          {aviso && (
            <div style={{background:'rgba(184,145,47,.12)',border:'1px solid rgba(184,145,47,.3)',borderRadius:10,padding:'11px 13px',marginBottom:16,fontSize:13,color:'#8a6d18'}}>
              {aviso}
            </div>
          )}
          <div className="field"><label>Nome do paciente</label><input value={nome} onChange={e=>{setNome(e.target.value);setAviso('');}} placeholder="Nome completo" /></div>
          <div className="field"><label>Médico</label>
            <select value={medId} onChange={e=>{setMedId(e.target.value);setAviso('');}}>{medicos.map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}</select>
          </div>
          <div className="field"><label>Telefone</label><input value={tel} onChange={e=>setTel(e.target.value)} placeholder="Opcional" /></div>
          <div className="row2">
            <div className="field"><label>Data</label><input type="date" value={dia} onChange={e=>{setDia(e.target.value);setAviso('');}} /></div>
            <div className="field"><label>Horário</label><input type="time" value={hora} onChange={e=>{setHora(e.target.value);setAviso('');}} /></div>
          </div>
          <div className="field"><label>Duração</label>
            <select value={dur} onChange={e=>{setDur(e.target.value);setAviso('');}}><option value="15">15 minutos</option><option value="30">30 minutos</option><option value="45">45 minutos</option><option value="60">1 hora</option></select>
          </div>
          <div className="field"><label>Observação</label><textarea value={obs} onChange={e=>setObs(e.target.value)} placeholder="Opcional" /></div>
          <div className="field"><label>Secretária responsável</label><input value={secretaria} onChange={e=>setSecretaria(e.target.value)} placeholder="Quem está agendando" /></div>
        </div>
        <div className="modal-foot">
          {editando
            ? <button className="btn-ghost" style={{color:'var(--rose)',borderColor:'rgba(168,74,91,.3)'}} onClick={()=>onCancelar(ev.id)}>Cancelar consulta</button>
            : <button className="btn-ghost" onClick={onClose}>Voltar</button>}
          <button className="btn-primary" onClick={tentarSalvar}>{aviso?'Confirmar mesmo assim':editando?'Salvar':'Agendar'}</button>
        </div>
      </div>
    </div>
  );
}
function toDateInput(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toTimeInput(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
